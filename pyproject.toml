[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-claude-native-bridge"
version = "0.2.0"
description = "Experimental native Claude Code Channels provider for Hermes"
authors = [{ name = "unsupportedpastels", email = "theoldwizard123@pm.me" }]
maintainers = [{ name = "unsupportedpastels", email = "theoldwizard123@pm.me" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# No requires-python: Hermes selects the interpreter for the adapter, and its
# package manager selects the one for the isolated server runtime.
# Host dependencies only; all are Hermes dependencies already. Minimums only.
dependencies = [
  "PyYAML>=6", "httpx>=0.27", "openai>=2",
  "filelock>=3.15", "python-dotenv>=1", "psutil>=5.9",
  "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Installed only into the plugin's own server runtime (runtime_environment.py
# SERVER_REQUIREMENTS), never into Hermes's environment.
server = [
  "PyYAML>=6", "fastapi>=0.115", "uvicorn>=0.30", "jsonschema>=4",
  "httpx>=0.27", "psutil>=5.9", "filelock>=3.15",
  "pywinpty>=2.0.15; sys_platform == 'win32'",
  "pywin32>=308; sys_platform == 'win32'",
  "pyte>=0.8.2; sys_platform == 'win32'",
]

[project.entry-points."hermes_agent.plugins"]
claude-native-bridge = "claude_native_bridge.provider:register"

[project.scripts]
hermes-claude-bridge = "claude_native_bridge.__main__:main"

# Live harnesses must set their temporary HERMES_HOME before importing Hermes.
[tool.ruff.lint.per-file-ignores]
"evals/*.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["claude_native_bridge*"]

[tool.setuptools.package-data]
claude_native_bridge = ["channel/README.md", "channel/server.mjs", "channel/protocol.mjs", "channel/http.mjs", "channel/platform.mjs", "channel/diagnostic-log.mjs", "channel/package.json", "channel/package-lock.json"]

[tool.setuptools.data-files]
"share/doc/hermes-claude-native-bridge" = ["RELEASE_NOTES.md"]
