name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The plugin imports Hermes core (providers, agent) from a checkout, the way an installed plugin does.
      HERMES_AGENT_REPO: ${{ github.workspace }}/hermes-agent
      PYTHONUTF8: "1"
    steps:
      - name: Allow long paths (hermes-agent's docs tree exceeds MAX_PATH)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          # The Hermes commit the live install runs. Bump it deliberately: an
          # unpinned main changes host behavior under the suite without notice.
          ref: 59004a62356f3a4697ab0fe8ad5086d2b405e2a6
          path: hermes-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Real tmux sessions exercise the Unix supervisor and teardown tests.
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Install Hermes and the plugin with its server extra
        # ruamel.yaml, requests: Hermes' bundled providers and picker import them,
        # but its base install omits them (the live install's venv has both).
        run: python -m pip install -e ./hermes-agent -e "./plugin[server]" ruamel.yaml requests pytest pytest-asyncio
      - name: Install locked channel dependencies
        working-directory: plugin/claude_native_bridge/channel
        run: npm ci --ignore-scripts

      - name: Channel tests
        if: runner.os != 'Windows'
        working-directory: plugin/claude_native_bridge/channel
        run: npm test
      - name: Python suite (real process trees, tmux, cancellation)
        if: runner.os != 'Windows' && !cancelled()
        working-directory: plugin
        env:
          # The runner context is only available at step level.
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: python -m pytest -q -p no:cacheprovider

      # Hosted Windows runners are elevated administrators; real installs never are.
      - name: Channel tests (Windows, standard user)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./plugin/.github/scripts/as-standard-user.ps1 -WorkingDirectory "$env:GITHUB_WORKSPACE\plugin\claude_native_bridge\channel" -Command 'npm test'
      - name: Python suite (Windows, standard user, real ConPTY and ACLs)
        if: runner.os == 'Windows' && !cancelled()
        shell: powershell
        run: ./plugin/.github/scripts/as-standard-user.ps1 -WorkingDirectory "$env:GITHUB_WORKSPACE\plugin" -Command 'python -m pytest -q -p no:cacheprovider'
